<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ZINKI · 跑团记录</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="6.5" /><path d="M16 16 L20.5 20.5" />
    </symbol>
    <symbol id="i-filter" viewBox="0 0 24 24">
      <path d="M4 5 L20 5 L13.8 11.9 L13.8 17.4 L10.2 19.4 L10.2 11.9 Z" />
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="M6 6 L18 18 M18 6 L6 18" />
    </symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24">
      <path d="M6 9.5 L12 15.5 L18 9.5" />
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M5 12.5 L10 17.5 L19 7" />
    </symbol>
    <symbol id="i-eye" viewBox="0 0 24 24">
      <path d="M2.5 12 S6 6 12 6 S21.5 12 21.5 12 S18 18 12 18 S2.5 12 2.5 12 Z" />
      <circle cx="12" cy="12" r="2.7" />
    </symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24">
      <path d="M2.5 12 S6 6 12 6 S21.5 12 21.5 12 S18 18 12 18 S2.5 12 2.5 12 Z" />
      <path d="M4.5 4.5 L19.5 19.5" />
    </symbol>
    <symbol id="i-music" viewBox="0 0 24 24">
      <path d="M9 18 V6.5 L18.5 4.5 V16" />
      <circle cx="6.7" cy="18" r="2.2" /><circle cx="16.2" cy="16" r="2.2" />
    </symbol>
    <symbol id="i-dice" viewBox="0 0 24 24">
      <rect x="6.4" y="6.4" width="11.2" height="11.2" rx="2.6" />
      <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none" />
    </symbol>
    <symbol id="i-external" viewBox="0 0 24 24">
      <path d="M14 4.5 H19.5 V10 M19.5 4.5 L11 13" />
      <path d="M19.5 14.5 V18 A1.5 1.5 0 0 1 18 19.5 H6 A1.5 1.5 0 0 1 4.5 18 V6 A1.5 1.5 0 0 1 6 4.5 H10" />
    </symbol>
    <symbol id="i-palette" viewBox="0 0 24 24">
      <path d="M12 3 A9 9 0 1 0 12 21 A2.2 2.2 0 0 1 9.8 18.8 C9.8 17.9 10.4 17.2 11.2 17.2 H13.4 A5 5 0 0 0 18.4 12.2 C18.4 7.1 15.6 3 12 3 Z" />
      <circle cx="7.8" cy="9" r="1.1" fill="currentColor" stroke="none" />
      <circle cx="11" cy="6.8" r="1.1" fill="currentColor" stroke="none" />
      <circle cx="15" cy="7.4" r="1.1" fill="currentColor" stroke="none" />
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <path d="M8 5.4 V18.6 L18 12 Z" />
    </symbol>
    <symbol id="i-pause" viewBox="0 0 24 24">
      <path d="M7 5.4 H10 V18.6 H7 Z M14 5.4 H17 V18.6 H14 Z" />
    </symbol>
    <symbol id="i-prev" viewBox="0 0 24 24">
      <path d="M18 5.4 V18.6 L8.5 12 Z" />
      <path d="M7.5 5.4 V18.6" />
    </symbol>
    <symbol id="i-next" viewBox="0 0 24 24">
      <path d="M6 5.4 V18.6 L15.5 12 Z" />
      <path d="M16.5 5.4 V18.6" />
    </symbol>
    <symbol id="i-list" viewBox="0 0 24 24">
      <path d="M4 7 H13 M4 12 H13 M4 17 H13" />
      <path d="M17 9.5 V16" />
      <circle cx="17" cy="16.5" r="1.8" />
    </symbol>
    <symbol id="i-volume" viewBox="0 0 24 24">
      <path d="M4 9.4 V14.6 H7.4 L12 19 V5 L7.4 9.4 Z" />
      <path d="M15.6 9 A4.4 4.4 0 0 1 15.6 15" />
    </symbol>
    <symbol id="i-volume-mute" viewBox="0 0 24 24">
      <path d="M4 9.4 V14.6 H7.4 L12 19 V5 L7.4 9.4 Z" />
      <path d="M16 10 L20 14 M20 10 L16 14" />
    </symbol>
  </svg>

  <header class="topbar">
    <div class="topbar-left">
      <div class="cat-switch">
        <button class="line-btn" id="catBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="line-btn-title" id="catBtnTitle">ZINKI</span>
          <svg class="icon"><use href="#i-chevron-down" /></svg>
        </button>
        <div class="pop cat-pop" id="catPop" hidden></div>
      </div>
      <div class="line-switch">
        <button class="line-btn" id="lineBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="line-btn-title" id="lineBtnTitle">全部</span>
          <span class="line-btn-sub" id="lineBtnSub"></span>
          <svg class="icon"><use href="#i-chevron-down" /></svg>
        </button>
        <div class="pop line-pop" id="linePop" hidden></div>
      </div>
    </div>

    <div class="actions">
      <div class="search">
        <svg class="icon"><use href="#i-search" /></svg>
        <input id="searchInput" type="text" placeholder="搜索发言…" autocomplete="off" spellcheck="false" />
        <button class="search-clear" id="searchClear" type="button" aria-label="清除搜索" hidden>
          <svg class="icon"><use href="#i-close" /></svg>
        </button>
      </div>
      <button class="btn icon-btn" id="filterBtn" type="button" aria-label="筛选角色" title="筛选角色">
        <svg class="icon"><use href="#i-filter" /></svg>
        <span class="badge" id="filterBadge" hidden></span>
      </button>
    </div>
  </header>

  <div class="pop filter-pop" id="filterPop" hidden></div>

  <main class="stage">
    <div class="stage-head" id="stageHead"></div>
    <div class="transcript" id="transcript"></div>
    <div class="load-sentinel" id="loadSentinel"></div>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <footer class="player" id="player" hidden>
    <div class="player-info">
      <span class="player-title" id="playerTitle">音乐</span>
      <span class="player-sub" id="playerSub"></span>
    </div>
    <div class="player-controls">
      <button class="ctrl" id="playerPrevBtn" type="button" aria-label="上一首" title="上一首">
        <svg class="icon icon-fill"><use href="#i-prev" /></svg>
      </button>
      <button class="ctrl ctrl-main" id="playerPlayBtn" type="button" aria-label="播放 / 暂停" title="播放 / 暂停">
        <svg class="icon icon-fill" id="playerPlayIcon"><use href="#i-play" /></svg>
      </button>
      <button class="ctrl" id="playerNextBtn" type="button" aria-label="下一首" title="下一首">
        <svg class="icon icon-fill"><use href="#i-next" /></svg>
      </button>
    </div>
    <div class="player-progress">
      <span class="time" id="playerCur">0:00</span>
      <input type="range" class="seek" id="playerSeek" min="0" max="1000" value="0" step="0.1" aria-label="播放进度" />
      <span class="time" id="playerDur">0:00</span>
    </div>
    <div class="player-volume">
      <svg class="icon" id="volumeIcon"><use href="#i-volume" /></svg>
      <input type="range" id="playerVolume" min="0" max="100" value="80" aria-label="音量" />
    </div>
    <button class="ctrl" id="playerListBtn" type="button" aria-label="播放列表" title="播放列表">
      <svg class="icon"><use href="#i-list" /></svg>
    </button>
  </footer>

  <div class="pop playlist-pop" id="playlistPop" hidden></div>

  <script src="data/zinki-data.js"></script>
  <script src="data/letter-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
